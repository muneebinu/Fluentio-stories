<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fluentio Vocabulary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span>FLUENTIO</span><strong>STORIES</strong></header>
  <main>
    <div class="summary"><h1>Your words</h1><span id="count">0 saved</span></div>
    <p class="hint">Select a German word or phrase on any webpage to look it up and save it here.</p>
    <div id="list" class="list"></div>
    <div class="actions"><button id="export">Export CSV</button><button id="clear">Clear list</button></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
